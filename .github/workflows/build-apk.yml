name: Pruebas, instalador y paquete

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lankdea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pruebas
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 1-programa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 1-programa/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q main.py lankdea scripts
      - run: python -m pytest -q
      - name: Verificar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from scripts.release_lib import project_version; assert os.environ['RELEASE_TAG'] == 'v' + project_version(), 'La etiqueta no coincide con la versión'"

  build-apk-debug:
    name: Android Local (pruebas)
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: 1-programa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Declarar canal sin secretos
        run: |
          echo "### APK de pruebas (sin acceso a la firma estable)" >> "$GITHUB_STEP_SUMMARY"
          echo "El ZIP estará marcado PRUEBAS; no garantiza actualización sobre una APK anterior." >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Android
        run: |
          python scripts/configure_edition.py
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache cmake git libffi-dev libltdl-dev libssl-dev libtool openjdk-17-jdk pkg-config unzip zip zlib1g-dev
          python -m pip install "buildozer>=1.5,<2" "cython<3.1"

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: android-cache
        with:
          path: |
            1-programa/.buildozer
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r27c
            ~/.buildozer/android/platform/apache-ant-1.9.4
          key: buildozer-v4-${{ runner.os }}-local-${{ hashFiles('1-programa/buildozer.local.spec', '1-programa/pyproject.toml') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-local-
            buildozer-v3-${{ runner.os }}-local-

      - name: Migrar caché anterior a la carpeta del programa
        shell: bash
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.buildozer" && ! -d .buildozer ]]; then
            mv "$GITHUB_WORKSPACE/.buildozer" .buildozer
          fi

      - name: Compilar APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        shell: bash
        run: |
          buildozer -v android debug

      - name: Conservar compilación antes de validar la entrega
        if: steps.android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            1-programa/.buildozer
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r27c
            ~/.buildozer/android/platform/apache-ant-1.9.4
          key: ${{ steps.android-cache.outputs.cache-primary-key }}

      - name: Verificar identidad, firma y versión de la APK
        env:
          BUILD_MODE: debug
        shell: bash
        run: |
          mapfile -t apks < <(find bin -maxdepth 1 -type f -name '*.apk')
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Se esperaba exactamente una APK recién compilada."
            exit 1
          fi
          build_tools=$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          python -m scripts.record_android --apk "${apks[0]}" --aapt "$build_tools/aapt" --apksigner "$build_tools/apksigner" --signing "$BUILD_MODE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lankdea-Android
          path: 2-instaladores/android/
          if-no-files-found: error
          retention-days: 30

  build-apk-release:
    name: Android Local (publicación protegida)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: 1-programa
    environment:
      name: android-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Exigir firma estable del Environment protegido
        env:
          CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || ! "$CERTIFICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::La etiqueta requiere los cuatro secretos y la huella del certificado en android-release."
            exit 1
          fi

      - name: Preparar Android desde cero
        run: |
          python scripts/configure_edition.py
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache cmake git libffi-dev libltdl-dev libssl-dev libtool openjdk-17-jdk pkg-config unzip zip zlib1g-dev
          python -m pip install "buildozer>=1.5,<2" "cython<3.1"

      - name: Compilar APK release sin conservar la llave
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/lankdea-release.keystore"
          trap 'rm -f -- "$P4A_RELEASE_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$P4A_RELEASE_KEYSTORE"
          buildozer -v android release

      - name: Verificar identidad, firma y versión de la APK
        env:
          CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
        shell: bash
        run: |
          mapfile -t apks < <(find bin -maxdepth 1 -type f -name '*.apk')
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Se esperaba exactamente una APK recién compilada."
            exit 1
          fi
          build_tools=$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          python -m scripts.record_android --apk "${apks[0]}" --aapt "$build_tools/aapt" --apksigner "$build_tools/apksigner" --signing release --expected-certificate "$CERTIFICATE_SHA256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lankdea-Android
          path: 2-instaladores/android/
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Instalador Windows
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 1-programa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 1-programa/pyproject.toml
      - run: python -m pip install -e ".[desktop]" "pyinstaller>=6,<7"
      - run: python -m scripts.build_windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lankdea-Windows
          path: 2-instaladores/windows/
          if-no-files-found: error
          retention-days: 30

  package-debug:
    name: ZIP de pruebas Windows y Android
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-apk-debug]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 1-programa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lankdea-Windows
          path: 2-instaladores/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lankdea-Android
          path: 2-instaladores/android
      - name: Crear y verificar ZIP
        run: python -m scripts.create_package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lankdea-Paquete-Completo
          path: 2-instaladores/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Resumen
        run: |
          echo "### Paquete completo generado y verificado" >> "$GITHUB_STEP_SUMMARY"
          echo "Descarga Lankdea-Paquete-Completo: contiene el ZIP con instalador Windows, APK, manual, manifiesto y SHA-256." >> "$GITHUB_STEP_SUMMARY"

  package-release:
    name: ZIP oficial Windows y Android
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-apk-release]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 1-programa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lankdea-Windows
          path: 2-instaladores/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lankdea-Android
          path: 2-instaladores/android
      - name: Crear y verificar ZIP oficial
        run: python -m scripts.create_package --require-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Lankdea-Paquete-Completo
          path: 2-instaladores/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publicar versión etiquetada
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Lankdea-Paquete-Completo
          path: package
      - name: Verificar y preparar descargas individuales
        working-directory: 1-programa
        run: |
          mapfile -t packages < <(find ../package -maxdepth 1 -type f -name '*.zip')
          test "${#packages[@]}" -eq 1
          python -m scripts.extract_downloads "${packages[0]}" ../downloads
      - name: Publicar sin reemplazar una versión existente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" package/*.zip downloads/* --verify-tag --generate-notes --title "Lankdea Local $RELEASE_TAG"
